<html lang="en"><head>
<meta charset="utf-8">

<style>
:root{--bg:#070912;--panel:#12152a;--panel2:#1b1f3b;--ink:#eef1ff;--muted:#8d93c4;--hot:#ff2e63;--cyan:#3cf0ff;--gold:#ffc94d;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
canvas{display:block}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;z-index:5;background:radial-gradient(ellipse at 50% 35%,rgba(60,240,255,.10),rgba(7,9,18,.88) 60%)}
.screen.hidden{display:none}
.box{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px;text-align:center}
.in{opacity:0;transform:translateY(16px);animation:rise .42s var(--ease) forwards}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.logo{font-size:46px;font-weight:900;letter-spacing:-1px;line-height:.95;background:linear-gradient(180deg,#fff,#9ef6ff 55%,#3cf0ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(60,240,255,.45))}
.logo span{display:block;background:linear-gradient(180deg,#ffd0dc,#ff2e63);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 18px rgba(255,46,99,.5))}
.tag{color:var(--muted);font-size:14px;margin:0}
.btn{font:800 18px system-ui;padding:15px;border-radius:16px;border:0;cursor:pointer;color:#fff;background:linear-gradient(180deg,#ff5c8a,#ff2e63);box-shadow:0 8px 28px rgba(255,46,99,.4),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .14s var(--ease)}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--panel2);box-shadow:none;color:var(--muted);font-weight:700;font-size:16px}
.btn.cyan{background:linear-gradient(180deg,#7ff7ff,#16c6e0);color:#04121a;box-shadow:0 8px 28px rgba(60,240,255,.35)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border:1px solid #23284d;border-radius:14px;padding:10px 4px}
.stat b{display:block;font-size:22px}.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.h2{font-size:30px;font-weight:900;margin:0}
.lv{font-size:13px;letter-spacing:3px;color:var(--gold);font-weight:800}
.card{display:flex;gap:12px;align-items:center;text-align:left;background:var(--panel);border:1.5px solid #2a3060;border-radius:18px;padding:14px;cursor:pointer;color:var(--ink);font:inherit;transition:transform .16s var(--ease),border-color .16s}
.card:active{transform:scale(.97)}
.card .ic{flex:0 0 52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;background:var(--panel2)}
.card b{font-size:17px}.card p{margin:3px 0 0;color:var(--muted);font-size:13.5px;line-height:1.35}
.card .new{font-size:10px;font-weight:900;letter-spacing:1px;color:#04121a;background:var(--cyan);border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:2px}
.pips{margin-top:5px;display:flex;gap:4px}.pips i{width:14px;height:4px;border-radius:2px;background:#2a3060}.pips i.on{background:var(--gold)}.pips i.next{background:var(--cyan);animation:breathe 1.2s ease-in-out infinite}
.credits{font-weight:900;color:var(--gold);font-size:15px}.credits span{color:var(--muted);font-weight:700}
.box{max-height:100%;overflow-y:auto;scrollbar-width:none}.box::-webkit-scrollbar{display:none}.screen{touch-action:pan-y}
.card small.kind{display:block;font-size:9px;font-weight:900;letter-spacing:1.5px;margin-bottom:1px}
.lvl{font-size:11px;font-weight:900;color:var(--gold);margin-left:6px}
#hudbtn{position:fixed;top:max(10px,env(safe-area-inset-top));right:10px;z-index:4;width:40px;height:40px;border-radius:12px;border:1px solid #2a3060;background:rgba(18,21,42,.7);color:var(--ink);font-size:16px;cursor:pointer;display:none}
.card.chosen{transform:scale(1.05);border-color:var(--gold)!important;box-shadow:0 0 0 2px var(--gold),0 0 40px rgba(255,201,77,.45);transition:transform .2s var(--ease),box-shadow .2s}
.card.fade{opacity:0;transform:translateY(10px) scale(.96);transition:opacity .18s,transform .18s}
.screen.out{animation:fadeout .15s ease-in forwards;pointer-events:none}@keyframes fadeout{to{opacity:0}}
#dash{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(26px,env(safe-area-inset-bottom));z-index:4;width:78px;height:78px;border-radius:50%;border:0;padding:4px;cursor:pointer;display:none;background:conic-gradient(var(--cyan) var(--p,100%),rgba(255,255,255,.08) 0);transition:transform .12s var(--ease)}
#ult{position:fixed;right:max(26px,env(safe-area-inset-right));bottom:max(118px,calc(env(safe-area-inset-bottom) + 92px));z-index:4;width:62px;height:62px;border-radius:50%;border:0;padding:4px;cursor:pointer;display:none;background:conic-gradient(var(--uc,#ffc94d) var(--p,0%),rgba(255,255,255,.08) 0);transition:transform .12s var(--ease)}
#ult span{display:flex;flex-direction:column;width:100%;height:100%;border-radius:50%;align-items:center;justify-content:center;background:rgba(12,15,32,.9);color:var(--uc,#ffc94d);font:900 11px system-ui;letter-spacing:.5px;line-height:1.1}
#ult span small{font-size:9px;opacity:.7}#ult.ready{box-shadow:0 0 26px var(--uc,#ffc94d);animation:breathe 1.2s ease-in-out infinite}#ult:active{transform:scale(.9)}
.card.r-legend{border-color:#ff2e63!important;box-shadow:0 0 26px rgba(255,46,99,.4);background:linear-gradient(135deg,#3a1030,var(--panel) 65%)}
#dash span{display:flex;width:100%;height:100%;border-radius:50%;align-items:center;justify-content:center;background:rgba(12,15,32,.88);color:var(--cyan);font:900 13px system-ui;letter-spacing:1px}
#dash.ready{box-shadow:0 0 24px rgba(60,240,255,.5)}#dash:active{transform:scale(.9)}
.logo.in{animation:rise .42s var(--ease) forwards,breathe 3.2s ease-in-out .6s infinite}@keyframes breathe{50%{filter:drop-shadow(0 0 30px rgba(60,240,255,.7))}}
.btn.mode{display:flex;flex-direction:column;gap:2px;padding:13px}.btn.mode b{font-size:19px;letter-spacing:1px}.btn.mode span{font-size:12px;font-weight:600;opacity:.8}
.status{display:flex;justify-content:center;gap:14px;font-size:13px;font-weight:800;color:var(--muted)}
.relics{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.relics span{width:30px;height:30px;border-radius:9px;border:1.5px solid;display:flex;align-items:center;justify-content:center;background:var(--panel);font-size:15px}
.route{display:flex;align-items:center;justify-content:center;gap:0}.route b{width:22px;height:2px;background:#2a3060}
.route i{width:14px;height:14px;border-radius:50%;border:2px solid #2a3060;font-style:normal;font-size:10px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.route i.done{background:var(--c);border-color:var(--c)}.route i.now{border-color:var(--c);box-shadow:0 0 12px var(--c);animation:breathe 1.6s ease-in-out infinite}.route i.boss{width:22px;height:22px}
.sysbar{display:flex;gap:6px;justify-content:center}.sysbar i{width:34px;height:5px;border-radius:3px;background:#2a3060}.sysbar i.done{background:var(--c)}.sysbar i.now{background:var(--c);box-shadow:0 0 10px var(--c)}
.card:disabled{cursor:default}.price{font-weight:900;color:var(--gold);white-space:nowrap;font-size:14px}
.score{display:flex;flex-direction:column;align-items:center;gap:2px}.score span{font-size:11px;letter-spacing:3px;color:var(--muted);font-weight:800}
.score b{font-size:44px;font-weight:900;color:var(--gold);text-shadow:0 0 24px rgba(255,201,77,.45);font-variant-numeric:tabular-nums}
.score em{font-style:normal;font-size:12px;font-weight:900;letter-spacing:1px;color:#04121a;background:var(--gold);border-radius:8px;padding:3px 9px;animation:pop .5s var(--ease) .9s both}
.namebox{display:flex;gap:8px}.namebox input{flex:1;min-width:0;font:700 16px system-ui;padding:12px 14px;border-radius:14px;border:1.5px solid #2a3060;background:var(--panel);color:var(--ink);outline:none}.namebox input:focus{border-color:var(--cyan)}.namebox .btn{padding:12px 18px;font-size:16px}
.tabs{display:flex;background:var(--panel);border-radius:14px;padding:4px}.tabs button{flex:1;font:800 14px system-ui;padding:10px;border:0;border-radius:11px;background:none;color:var(--muted);cursor:pointer}.tabs button.on{background:var(--panel2);color:var(--ink)}
table.board{width:100%;border-collapse:collapse;font-size:14px;background:var(--panel);border-radius:16px;overflow:hidden}
.board th{font-size:10px;letter-spacing:1.5px;color:var(--muted);text-align:left;padding:10px 8px;font-weight:800}.board td{padding:9px 8px;border-top:1px solid #1f2446;text-align:left}
.board td:last-child,.board th:last-child{text-align:right;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}.board td:nth-child(3){color:var(--muted);font-size:12px}
.board tr.me td{background:rgba(60,240,255,.12)}
.card.r-common{border-color:#2a3060!important}
.card.r-rare{border-color:#3c9bff!important;box-shadow:0 0 18px rgba(60,155,255,.22)}
.card.r-epic{border-color:#b06bff!important;box-shadow:0 0 22px rgba(176,107,255,.3);background:linear-gradient(135deg,#1b1640,var(--panel) 60%)}
.card.in{animation:cardin .22s ease-out forwards;transform:translateY(10px);opacity:0}
@keyframes cardin{to{transform:none;opacity:1}}
@keyframes flip{to{transform:none;opacity:1}}
.chestwrap{position:relative;height:150px;display:flex;align-items:center;justify-content:center}
.chestimg{width:120px;position:relative;z-index:1;animation:pop .6s var(--ease) both,bob 1.6s ease-in-out .6s infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.beams{position:absolute;width:260px;height:260px;border-radius:50%;background:repeating-conic-gradient(rgba(255,201,77,.28) 0 10deg,transparent 10deg 30deg);animation:spin 6s linear infinite;-webkit-mask:radial-gradient(circle,#000 20%,transparent 68%);mask:radial-gradient(circle,#000 20%,transparent 68%)}
.beams.legend{background:repeating-conic-gradient(rgba(255,46,99,.35) 0 8deg,rgba(255,201,77,.3) 8deg 16deg,transparent 16deg 30deg)}
@keyframes spin{to{transform:rotate(360deg)}}
.reels{display:flex;gap:8px;justify-content:center}
.reel{flex:1;max-width:120px;background:var(--panel);border:2px solid #2a3060;border-radius:16px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:border-color .2s,transform .2s}
.reel .ri{font-size:32px;height:40px;display:flex;align-items:center}.reel b{font-size:13px;min-height:16px}.reel p{margin:0;font-size:11px;color:var(--muted);min-height:14px}
.reel.done{transform:scale(1.05);animation:pop .35s var(--ease)}
.reel.r-legend.done{box-shadow:0 0 30px rgba(255,46,99,.5);background:linear-gradient(160deg,#3a1030,var(--panel))}
.shipsel{display:flex;align-items:center;gap:6px}
.shipsel .arrow{flex:0 0 34px;height:64px;border-radius:12px;border:1px solid #2a3060;background:var(--panel);color:var(--ink);font-size:24px;cursor:pointer}
.shipcard{flex:1;display:flex;gap:8px;align-items:center;text-align:left;background:var(--panel);border:1px solid #2a3060;border-radius:16px;padding:6px 10px 6px 4px;min-height:100px}
.shipcard canvas{width:84px;height:84px;flex:0 0 84px}.shipcard b{font-size:16px}.shipcard p{margin:2px 0;font-size:12px;color:var(--muted);line-height:1.3}.shipcard small{font-size:11px;color:var(--cyan);display:block;margin-bottom:5px}
.shipcard em{font-style:normal;font-size:10px;font-weight:900;letter-spacing:1px;color:#04121a;background:var(--cyan);border-radius:6px;padding:2px 7px}
.shipcard.locked b{color:var(--muted)}
.shipcard em{white-space:nowrap}.mst{font-size:10px;font-weight:800;color:var(--gold);margin-left:6px;white-space:nowrap}
.mini{font:800 12px system-ui;border:0;border-radius:9px;padding:6px 10px;cursor:pointer;background:var(--panel2);color:var(--ink)}.mini.gold{background:var(--gold);color:#241500}.mini:disabled{opacity:.45}
.missions{background:var(--panel);border:1px solid #23284d;border-radius:16px;padding:10px 12px;text-align:left}
.missions .mh{font-size:11px;font-weight:900;letter-spacing:2px;color:var(--gold);margin-bottom:4px}.missions .mh span{color:var(--muted);letter-spacing:0;font-weight:600}
.mrow{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:5px 0;border-top:1px solid #1f2446}.mrow b{color:var(--gold);white-space:nowrap}
.mres{background:rgba(92,255,176,.08);border:1px solid rgba(92,255,176,.35);border-radius:14px;padding:8px 12px;text-align:left;font-size:13px}.mres div{display:flex;justify-content:space-between;padding:3px 0}.mres b{color:var(--gold)}
/* chosen / faded cards must escape the entrance animation's fill */
.card.chosen{animation:none!important;opacity:1}.card.fade{animation:none!important}
@media (prefers-reduced-motion:reduce){.card.in{animation:none;opacity:1;transform:none}.beams{animation:none}}
.tagc{display:inline-block;font-size:10px;font-weight:800;border:1px solid;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.sets{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.sets span{font-size:12px;font-weight:800;border:1.5px solid;border-radius:10px;padding:4px 9px;background:var(--panel)}
.galtop{display:flex;justify-content:center;gap:18px;font-weight:900;font-size:15px}.galtop span:last-child{color:var(--cyan)}
.goal{margin:0;font-size:13px;color:var(--muted);background:var(--panel);border:1px dashed #2f3566;border-radius:12px;padding:8px 10px}.goal b{color:var(--gold)}
.settings{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.systabs{display:flex;gap:6px;justify-content:center}.systabs button{width:40px;height:40px;border-radius:12px;border:1.5px solid #2a3060;background:var(--panel);color:var(--c);font:900 15px system-ui;cursor:pointer}.systabs button.on{border-color:var(--c);box-shadow:0 0 14px var(--c)}.systabs button.lock{color:var(--muted);opacity:.6}
.path{display:grid;grid-template-columns:repeat(5,1fr);gap:10px 8px;padding:6px 2px}
.node{aspect-ratio:1;border-radius:50%;border:2px solid var(--c);background:radial-gradient(circle at 35% 30%,#252b55,var(--panel));color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font:900 16px system-ui;padding:0;transition:transform .14s var(--ease)}
.node em{font-style:normal;font-size:9px;color:var(--gold);letter-spacing:-1px}.node em i{font-style:normal;color:#3a3f66}
.node.next{box-shadow:0 0 16px var(--c);animation:breathe 1.6s ease-in-out infinite}.node.lock{border-color:#2a3060;opacity:.5;cursor:default}.node.boss{border-width:3px;background:radial-gradient(circle,#3a1030,var(--panel))}
.node:not(.lock):active{transform:scale(.92)}
.path .node:nth-child(10n+6),.path .node:nth-child(10n+7),.path .node:nth-child(10n+8),.path .node:nth-child(10n+9),.path .node:nth-child(10n+10){order:0}
.stars{display:flex;justify-content:center;gap:10px;font-size:46px}.stars i{font-style:normal;color:#2a3060}.stars i.on{color:var(--gold);text-shadow:0 0 22px rgba(255,201,77,.7);animation:pop .5s var(--ease) both}.stars.small{font-size:28px}
.starreq{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}.starreq span.on{color:#5cffb0}
.rec{font-size:11px}.rec i{font-style:normal}
.card p.evo{font-size:11.5px;font-weight:800;margin-top:4px;letter-spacing:.2px}
.build .evo{opacity:.55}.build .evo.done{opacity:1}
.screen.solid{background:rgba(7,9,18,.95)}
.fun{display:flex;align-items:center;justify-content:center;gap:6px;margin:10px 0 2px;font-size:13px;color:var(--muted)}.fun button{font-size:22px;background:none;border:0;cursor:pointer;padding:2px 4px}
.clue{text-align:center;font-size:13px;font-weight:700;color:#ffd84d;background:rgba(255,216,77,.08);border:1px solid rgba(255,216,77,.3);border-radius:10px;padding:7px 10px;margin:8px 0 0}
.btn.gold{background:linear-gradient(90deg,#ffd84d,#ffb02e);color:#241500}.btn.gold:disabled,.btn.ghost:disabled{opacity:.6}
.dm{display:flex;flex-direction:column;gap:6px;margin:10px 0}.dm>div{display:flex;align-items:center;gap:8px;background:rgba(18,21,42,.9);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:8px 10px;font-size:13px}
.dm span{flex:1;text-align:left}.dm em{font-style:normal;color:var(--muted);font-size:12px}.dm b{font-size:12px;color:#5cffb0}.dm b.r{color:#7f86c0}.dm>div.done{border-color:#5cffb066}
.paints{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.pnt{background:rgba(18,21,42,.92);border:1.5px solid rgba(255,255,255,.1);border-radius:12px;padding:6px 2px;color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:center;cursor:pointer;min-width:0}
.pnt canvas{width:46px;height:46px}.pnt b{font-size:11.5px}.pnt em{font-style:normal;font-size:9.5px;color:var(--muted);line-height:1.2;text-align:center}.pnt.on{border-color:#c08bff;box-shadow:0 0 12px rgba(192,139,255,.35)}.pnt:disabled{opacity:.45}
.notes{margin:8px 0 0}.notes p{margin:3px 0;text-align:center;font-size:12.5px;font-weight:700;color:#c9c6ff}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff4d6d;margin-left:5px;vertical-align:2px;box-shadow:0 0 8px #ff4d6d}
.play{font-size:21px;padding:15px;letter-spacing:2px}
.gain{font-size:38px;font-weight:900;color:#7fd1ff;text-align:center;margin:4px 0}
.tierline{text-align:center;font-size:13px;font-weight:800;margin:10px 0 6px;color:var(--muted)}.tierline.evolved{animation:pop .5s}
.up3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.upb{background:rgba(18,21,42,.92);border:1.5px solid rgba(255,255,255,.12);border-radius:14px;padding:9px 4px 8px;color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;min-width:0}
.upb i{font-style:normal;font-size:22px;line-height:1.1}.upb b{font-size:13px}.upb em{font-style:normal;font-size:11px;color:var(--muted)}
.upb .cost{font-size:12px;font-weight:800;color:#7f86c0;margin-top:3px}
.upb.can{border-color:#5cffb0;box-shadow:0 0 14px rgba(92,255,176,.22)}.upb.can .cost{color:#5cffb0}
.upb:disabled{opacity:.55}.upb.bought{animation:pop .35s}.upb.nope{animation:nope .3s}
.upp{display:flex;gap:3px;margin-top:4px}.upp s{width:12px;height:4px;border-radius:2px;background:rgba(255,255,255,.15)}.upp s.on{background:#5cffb0}
.btn.evo{background:linear-gradient(90deg,#b06bff,#ff6bd5);color:#fff;margin-top:10px;display:flex;flex-direction:column;align-items:center}.btn.evo small{font-size:11px;font-weight:700;opacity:.85}.btn.evo:disabled{opacity:.5}
.hint{text-align:center;font-size:12.5px;color:var(--muted);margin:8px 0 0}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
